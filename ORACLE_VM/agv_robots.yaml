# AGV Robot Configuration  —  step-route dispatcher model
#
# All AGVs start at the depot (blue sticker).  The factory node sends
# pre-computed F/L/R move sequences; the robots have no map knowledge.

agvs:
  agv_1:
    name: "Alvik1"               # Hardware topic prefix (Alvik1_cmd / Alvik1_status)
    mac_address: "3C:84:27:C2:87:50"

  agv_2:
    name: "Alvik2"
    mac_address: "3C:84:27:C3:E7:DC"

  agv_3:
    name: "Alvik3"
    mac_address: "74:4D:BD:A2:1B:70"

  agv_4:
    name: "Alvik4"
    mac_address: "48:CA:43:2E:1D:CC"

communication:
  command_suffix: "_cmd"
  status_suffix:  "_status"

timing:
  status_timeout_sec:   2.0    # AGV considered offline after this
  arrived_timeout_sec: 180.0   # max time to wait for ARRIVED per segment
